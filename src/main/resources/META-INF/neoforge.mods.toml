modLoader = "javafml"
loaderVersion = "[2,)"
issueTrackerURL = "https://kubejs.com/support?source=kubegroovy&mc=2101&loader=neoforge"
license = "GNU LGPLv3"

[[mods]]
modId = "kubegroovy"
version = "${version}"
displayName = "KubeGroovy"
authors = "uncandango"
description = '''
Customize your modpack or server with Groovy!
'''
logoFile = "kubegroovy_logo.png"
modUrl = "https://kubejs.com"
displayURL = "https://kubejs.com"

[[dependencies.kubegroovy]]
modId = "neoforge"
type = "required"
versionRange = "${neoforgeVersions}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.kubegroovy]]
modId = "jei"
type = "optional"
versionRange = "[${jeiVersion},)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.kubegroovy]]
modId = "roughlyenoughitems"
type = "optional"
versionRange = "[${reiVersion},)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.kubegroovy]]
modId = "emi"
type = "optional"
versionRange = "[{emiVersion},)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.kubegroovy]]
modId = "betteradvancedtooltips"
type = "optional"
versionRange = "[${batVersion},)"
ordering = "BEFORE"
side = "CLIENT"

[[mixins]]
config = "kubegroovy.mixins.json"
